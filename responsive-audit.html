<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>商戦レスポンシブ監査</title>
<style>body{margin:16px;background:#101820;color:#fff;font:14px system-ui}nav{margin-bottom:12px}button{padding:10px;margin-right:8px}iframe{border:1px solid #859487;display:block}</style>
<nav><button data-size="390,844">縦持ち 390×844</button><button data-size="844,390">横持ち 844×390</button><button data-size="1190,720">PC 1190×720</button></nav>
<iframe title="ゲームの実画面" src="/" width="390" height="844"></iframe>
<script>document.querySelectorAll('button').forEach(button=>button.onclick=()=>{const [w,h]=button.dataset.size.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h;});</script>
</html>
