name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify rebuilt engine, progression, save isolation, and 500 simulations
        run: |
          npm run lint
          npm run check:renewal
      - name: Build game for project Pages path
        env:
          VITE_PUBLIC_BASE: /ttr-atk/
        run: npm run build:pages
      - name: Copy audio, fan-kit, manifest, and title assets
        run: |
          cp -R public/ff14-fankit dist/ff14-fankit
          cp -R public/game-audio dist/game-audio
          cp public/manifest.webmanifest dist/manifest.webmanifest
          cp public/title-hero-v1.png dist/title-hero-v1.png
          cp public/title-hero-v1.webp dist/title-hero-v1.webp
          touch dist/.nojekyll
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
