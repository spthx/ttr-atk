name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build game for project Pages path
        env:
          VITE_PUBLIC_BASE: /ttr-atk/
        run: pnpm run build:pages
      - name: Copy fan-kit, manifest, and title assets
        run: |
          cp -R public/ff14-fankit dist/ff14-fankit
          cp public/manifest.webmanifest dist/manifest.webmanifest
          cp public/title-hero-v1.png dist/title-hero-v1.png
          touch dist/.nojekyll
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
